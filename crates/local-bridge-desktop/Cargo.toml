[package]
name = "local-bridge-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Optional local-only desktop manager for Local Bridge"

# Deliberately independent: normal Bridge CLI/Native/MCP build stays Tauri-free.
[workspace]
resolver = "2"

[dependencies]
local-bridge = { path = "../local-bridge" }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
